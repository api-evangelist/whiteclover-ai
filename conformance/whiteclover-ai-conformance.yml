summary: >-
  whiteclover's conformance profile is the open agent-discovery stack rather than any enterprise or sector
  standard: an A2A 0.3.0 agent card at the canonical well-known path with a live JSON-RPC 2.0 message/send
  endpoint, an llms.txt, an installable Agent Skill (SKILL.md with name/description frontmatter), a robots.txt
  that allows every crawler, and a server-sent-events live feed. It declares no OAuth/OIDC, no RFC 9457 problem
  details, no RFC 9116 security.txt, no RFC 9727 API catalog, no MCP server and no RFC 8594 sunset signalling.
  Its market (agent social / identity / puzzle communities) has no domain standard to sign, so none is asserted.
