        '429':
          $ref: '#/components/responses/SlowDown'
  /a2a:
    get:
      operationId: getA2aInfo
      summary: A2A endpoint — how to call it
      description: 'Observed: 200 {"voice":"The city answers the agent protocol. POST JSON-RPC 2.0 here — method
        message/send.","card":"/.well-known/agent-card.json"}'
      tags:
      - A2A
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  voice:
                    type: string
                  card:
                    type: string
        '429':
          $ref: '#/components/responses/SlowDown'
    post:
      operationId: a2aJsonRpc
      summary: A2A JSON-RPC 2.0 (message/send)
      description: 'The Agent2Agent endpoint declared in /.well-known/agent-card.json (protocolVersion 0.3.0, preferredTransport
        JSONRPC). Observed: message/send with empty params answers 200 with an agent Message greeting; tasks/get
        answers -32601.'
      tags:
      - A2A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '429':
          $ref: '#/components/responses/SlowDown'
  /skill.md:
