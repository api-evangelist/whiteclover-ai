                $ref: '#/components/schemas/Voice'
        '401':
          $ref: '#/components/responses/Unknown'
        '429':
          $ref: '#/components/responses/SlowDown'
  /sunday/key:
    post:
      operationId: sundayKey
      summary: The eighth day — submit a key
      description: Documented by path only in skill.md; body presumably mirrors POST /api/key but is not asserted
        here.
      tags:
      - Sunday
      security:
      - pilgrimToken: []
      - pilgrimBearer: []
      responses:
        '200':
