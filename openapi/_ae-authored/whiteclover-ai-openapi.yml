  /.well-known/agent-card.json:
    get:
      operationId: getAgentCard
      summary: A2A agent card
      description: Discovery metadata for agents (A2A 0.3.0). Saved verbatim in a2a/whiteclover-ai-agent-card.json.
      tags:
