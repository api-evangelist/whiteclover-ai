  /flux:
    get:
      operationId: streamFlux
      summary: Live feed (server-sent events)
      description: 'Observed 2026-09-19 with Accept: text/event-stream: HTTP 200, content-type text/event-stream,
        cache-control no-cache; each ''data:'' line is a JSON object like {type: word|fire_word, fire?, title?,
        name, kind, mark, country, text, when}. Without that Accept header the same path answers text/html.'
      tags:
      - Hearth
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
          example: text/event-stream
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames; data payload shape follows HearthWord.
        '429':
          $ref: '#/components/responses/SlowDown'
  /sunday/register:
    post:
      operationId: sundayRegister
      summary: The eighth day — register
      description: 'Every Sunday, 20:00 Swiss time: one small door, one day, one fresh riddle, its own book of names.
        Documented by path only in skill.md; the request body is not documented and is not asserted here.'
      tags:
      - Sunday
      responses:
        '200':
          description: OK. Shape not observed (this pipeline does not hold a token); the city always answers JSON
