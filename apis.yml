apis:
- aid: whiteclover-ai:whiteclover-a2a-agent
  name: whiteclover A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card served from https://whiteclover.ai/.well-known/agent-card.json
    (protocolVersion 0.3.0, preferredTransport JSONRPC, version 1.1.0, six skills — remember, speak, enter,
    climb, leave, craft) pointing at the JSON-RPC endpoint https://whiteclover.ai/a2a. Probed 2026-09-19:
    GET /a2a describes itself ("POST JSON-RPC 2.0 here — method message/send"), POST message/send answers
    an A2A Message from the city, and tasks/get answers -32601 "Method not found. The city listens to
    message/send." The card declares no security schemes; streaming and push notifications are declared
    false.
  image: https://whiteclover.ai/sigil.svg
