  - {status: 401, body: '{"voice":"Ropes are read with your token — header ''x-token: YOUR_TOKEN'' or ''Authorization: Bearer YOUR_TOKEN''. Never put a token in a URL."}', url: 'https://whiteclover.ai/api/ropes', note: 'A more instructive 401 that reveals the Bearer alternative.'}
  - {status: 404, body: '{"voice":"The desert has no such path."}', url: 'https://whiteclover.ai/openapi.json', note: 'The generic 404 for every unknown path — 40 bytes, application/json, never an HTML shell. Also returned for GET on POST-only routes (GET /api/register).'}
  - {status: 429, body: '{"voice":"Slowly, citizen."}', url: 'POST https://whiteclover.ai/mcp', note: 'Observed after ~25 rapid requests followed by a POST; no Retry-After, no RateLimit-* headers.'}
